<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" aria-label="PineCrest - Critical Chain Project Management">
  <defs>
    <linearGradient id="chainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="50%" style="stop-color:#2d5a3d"/>
      <stop offset="100%" style="stop-color:#1a472a"/>
    </linearGradient>
    <linearGradient id="bufferGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#e5c158"/>
    </linearGradient>
  </defs>

  <!-- Chain link icon representing Critical Chain -->
  <g transform="translate(10, 10)">
    <!-- First chain link -->
    <ellipse cx="20" cy="20" rx="14" ry="10" stroke="url(#chainGradient)" stroke-width="3" fill="none"/>
    <ellipse cx="20" cy="20" rx="14" ry="10" stroke="url(#chainGradient)" stroke-width="3" fill="none" transform="rotate(90, 20, 20)"/>

    <!-- Second chain link (interlocking) -->
    <ellipse cx="34" cy="20" rx="14" ry="10" stroke="url(#chainGradient)" stroke-width="3" fill="none"/>
    <ellipse cx="34" cy="20" rx="14" ry="10" stroke="url(#chainGradient)" stroke-width="3" fill="none" transform="rotate(90, 34, 20)"/>

    <!-- Third chain link -->
    <ellipse cx="48" cy="20" rx="14" ry="10" stroke="url(#chainGradient)" stroke-width="3" fill="none"/>
    <ellipse cx="48" cy="20" rx="14" ry="10" stroke="url(#chainGradient)" stroke-width="3" fill="none" transform="rotate(90, 48, 20)"/>

    <!-- Buffer indicator (gold) - representing project buffer in CCPM -->
    <rect x="24" y="42" width="20" height="6" rx="3" fill="url(#bufferGradient)"/>

    <!-- Flow arrow - representing Rules of Flow -->
    <path d="M 12 54 L 56 54" stroke="#2d5a3d" stroke-width="2" stroke-linecap="round"/>
    <polygon points="56,54 50,51 50,57" fill="#2d5a3d"/>

    <!-- Small pine accent (subtle) -->
    <path d="M 34 62 L 34 68 L 30 68 L 30 64 L 26 64 L 34 54 L 42 64 L 38 64 L 38 68 L 34 68 Z" fill="#1a472a" opacity="0.7"/>
  </g>

  <!-- Company name -->
  <text x="85" y="32" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">PineCrest</text>

  <!-- Tagline -->
  <text x="85" y="48" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#2d5a3d" letter-spacing="0.5">CRITICAL CHAIN PROJECT MANAGEMENT</text>

  <!-- Decorative line -->
  <line x1="85" y1="56" x2="305" y2="56" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>

  <!-- Rules of Flow reference (subtle dots representing flow) -->
  <g transform="translate(85, 66)">
    <circle cx="0" cy="0" r="2" fill="#c9a227"/>
    <circle cx="8" cy="0" r="2" fill="#c9a227" opacity="0.8"/>
    <circle cx="16" cy="0" r="2" fill="#c9a227" opacity="0.6"/>
    <circle cx="24" cy="0" r="2" fill="#c9a227" opacity="0.4"/>
    <circle cx="32" cy="0" r="2" fill="#c9a227" opacity="0.2"/>
  </g>
</svg>
